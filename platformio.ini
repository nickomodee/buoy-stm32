; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_f303k8]
platform = ststm32
platform_packages =
  platformio/tool-openocd@2.1100.211028 ; !important: openocd 12 doesn't work
board = nucleo_f303k8
framework = stm32cube
extra_scripts = pre:pio_build_scripts/build_extra_pre.py
                post:pio_build_scripts/build_extra_post.py
                post:pio_build_scripts/extra_script.py
upload_protocol = stlink ; mbed, stlink
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wdouble-promotion
    -Wfloat-conversion
    -Wl,-Map,firmware.map
    -fstack-usage
    -fdump-ipa-cgraph
    -fdump-tree-optimized
    -Wno-attributes
    -ffreestanding
    -fno-builtin
board_build.ldscript = STM32F303K8TX_FLASH_modified.ld