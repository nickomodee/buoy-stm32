[env:nucleo_f303k8]
platform = ststm32
platform_packages =
  platformio/tool-openocd@2.1100.211028 ; !important: openocd 12 doesn't work
board = nucleo_f303k8
framework = stm32cube
upload_protocol = stlink ; mbed, stlink
build_flags = 
  -std=gnu++17